<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .radio-group input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5568d9;
        }

        .success-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 7px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Event Registration</h1>
        <p class="subtitle">Register now and reserve your seat!</p>

        <form id="registrationForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="event">Select Event</label>
                <select id="event" name="event" required>
                    <option value="">-- Select an event --</option>
                    <option value="Web Development Workshop">
                        Web Development Workshop
                    </option>
                    <option value="Coding Competition">
                        Coding Competition
                    </option>
                    <option value="Tech Conference">
                        Tech Conference
                    </option>
                    <option value="AI & Machine Learning Seminar">
                        AI & Machine Learning Seminar
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Attendance Type</label>

                <div class="radio-group">
                    <label>
                        <input
                            type="radio"
                            name="attendance"
                            value="Online"
                            required
                        >
                        Online
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="attendance"
                            value="In Person"
                        >
                        In Person
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="date">Event Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >
            </div>

            <div class="form-group">
                <label for="participants">Number of Participants</label>

                <select id="participants" name="participants" required>
                    <option value="">-- Select number --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Additional Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Enter any additional information..."
                ></textarea>
            </div>

            <button type="submit">
                Register Now
            </button>

        </form>

        <div class="success-message" id="successMessage">
            🎉 Registration successful! Thank you for registering.
        </div>

    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            successMessage.style.display = "block";

            form.reset();

            setTimeout(function() {
                successMessage.style.display = "none";
            }, 5000);
        });
    </script>

</body>
</html>
